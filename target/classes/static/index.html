<!DOCTYPE html>
<html>
<head>
    <title>GhostDrive</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
        .item { padding: 8px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .item:hover { background: #f5f5f5; }
        video { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
<h2>GhostDrive</h2>
<div id="breadcrumb"></div>
<div id="fileList"></div>
<video id="player" controls style="display:none;"></video>

<script>
    async function loadFiles(path) {
        const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
        const files = await res.json();

        document.getElementById("breadcrumb").textContent = "/" + path;
        const listDiv = document.getElementById("fileList");
        listDiv.innerHTML = "";

        if (path !== "") {
            const up = document.createElement("div");
            up.className = "item";
            up.textContent = "⬅ ..";
            up.onclick = () => {
                const parts = path.split("/");
                parts.pop();
                loadFiles(parts.join("/"));
            };
            listDiv.appendChild(up);
        }

        files.forEach(f => {
            const div = document.createElement("div");
            div.className = "item";
            div.textContent = (f.directory ? "📁 " : "📄 ") + f.name;
            div.onclick = () => {
                if (f.directory) {
                    loadFiles(f.path);
                } else if (f.name.match(/\.(mp4|webm|mkv)$/i)) {
                    const player = document.getElementById("player");
                    player.src = `/api/stream?path=${encodeURIComponent(f.path)}`;
                    player.style.display = "block";
                    player.play();
                } else {
                    window.location.href = `/api/download?path=${encodeURIComponent(f.path)}`;
                }
            };
            listDiv.appendChild(div);
        });
    }

    loadFiles("");
</script>
</body>
</html>
